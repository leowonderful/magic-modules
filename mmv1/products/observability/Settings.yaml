---
name: 'Settings'
description: Manages Cloud Observability settings for a project, folder, or organization.
min_version: 'beta'

# URLs are dynamic, so these are placeholders or less critical.
base_url: 'organizations/{{organization}}/locations/{{location}}/settings'
self_link: 'organizations/{{organization}}/locations/{{location}}/settings'

create_url: 'organizations/{{organization}}/locations/{{location}}/settings'
create_verb: 'PATCH'
update_url: 'organizations/{{organization}}/locations/{{location}}/settings'
update_verb: 'PATCH'

update_mask: true
exclude_delete: true
autogen_async: true

import_format:
  - 'organizations/{{organization}}/locations/{{location}}/settings'

async:
  operation:
    timeouts:
      insert_minutes: 10
      update_minutes: 10
    base_url: '{{op_id}}'
  result:
    resource_inside_response: true

custom_code:
  pre_create: templates/terraform/custom_expand/observability_settings_url.go.tmpl
  pre_update: templates/terraform/custom_expand/observability_settings_url.go.tmpl
  pre_read: templates/terraform/custom_expand/observability_settings_url.go.tmpl
  custom_import: templates/terraform/custom_import/observability_settings_import.go.tmpl


parameters:
  - name: 'location'
    type: String
    description: 'The location of the settings.'
    url_param_only: true
    required: true
    immutable: true

properties:
  - name: 'project_settings'
    type: NestedObject
    description: 'Settings specific to a project. Exactly one of project_settings, folder_settings, or organization_settings must be set.'
    exactly_one_of:
      - 'project_settings'
      - 'folder_settings'
      - 'organization_settings'
    properties:
      - name: 'project'
        type: String
        description: 'The ID of the project.'
        required: true
      - name: 'defaultStorageLocation'
        type: String
        description: 'The default storage location for new resources, e.g. buckets. Only valid for global location.'
        required: false
      - name: 'kmsKeyName'
        type: String
        description: 'The default Cloud KMS key to use for new resources. Only valid for regional locations.'
        required: false

  - name: 'folder_settings'
    type: NestedObject
    description: 'Settings specific to a folder. Exactly one of project_settings, folder_settings, or organization_settings must be set.'
    exactly_one_of:
      - 'project_settings'
      - 'folder_settings'
      - 'organization_settings'
    properties:
      - name: 'folder'
        type: String
        description: 'The ID of the folder.'
        required: true
      - name: 'defaultStorageLocation'
        type: String
        description: 'The default storage location for new resources, e.g. buckets. Only valid for global location.'
        required: false
      - name: 'kmsKeyName'
        type: String
        description: 'The default Cloud KMS key to use for new resources. Only valid for regional locations.'
        required: false

  - name: 'organization_settings'
    type: NestedObject
    description: 'Settings specific to an organization. Exactly one of project_settings, folder_settings, or organization_settings must be set.'
    exactly_one_of:
      - 'project_settings'
      - 'folder_settings'
      - 'organization_settings'
    properties:
      - name: 'organization'
        type: String
        description: 'The ID of the organization.'
        required: true
      - name: 'defaultStorageLocation'
        type: String
        description: 'The default storage location for new resources, e.g. buckets. Only valid for global location.'
        required: false
      - name: 'kmsKeyName'
        type: String
        description: 'The default Cloud KMS key to use for new resources. Only valid for regional locations.'
        required: false

  - name: 'name'
    type: String
    description: 'The resource name of the settings.'
    output: true
  - name: 'serviceAccountId'
    type: String
    description: 'The service account used by Cloud Observability for this project.'
    output: true

examples:
  - name: "observability_settings_project_basic"
    config_path: "templates/terraform/examples/observability_project_settings_basic.tf.tmpl"
    primary_resource_id: "settings"
    vars:
      location: "global"
      default_storage_location: "us-central1"
      project_id: ""
      kms_key_name: "example-key"
    test_vars_overrides:
      kms_key_name: 'acctest.BootstrapKMSKey(t).CryptoKey.Name'
  - name: "observability_settings_project_update"
    config_path: "templates/terraform/examples/observability_project_settings_update.tf.tmpl"
    primary_resource_id: "settings"
    vars:
      location: "global"
      default_storage_location: "us-central1"
      updated_default_storage_location: "europe-west1"
      project_id: ""
      kms_key_name: "example-key"
      updated_kms_key_name: "example-updated-key"
    test_env_vars:
      project_id: 'PROJECT_NUMBER'
    test_vars_overrides:
      kms_key_name: 'acctest.BootstrapKMSKey(t).CryptoKey.Name'
      updated_kms_key_name: '""'
  - name: "observability_settings_folder_basic"
    config_path: "templates/terraform/examples/observability_folder_settings_basic.tf.tmpl"
    primary_resource_id: "settings"
    vars:
      location: "global"
      default_storage_location: "us-central1"
      kms_key_name: "example-key"
      folder_id: ""
    test_vars_overrides:
      kms_key_name: 'acctest.BootstrapKMSKey(t).CryptoKey.Name'
    test_env_vars:
      org_id: 'ORG_ID'
      folder_id: 'FOLDER_ID'

  - name: "observability_settings_folder_update"
    config_path: "templates/terraform/examples/observability_folder_settings_update.tf.tmpl"
    primary_resource_id: "settings"
    vars:
      location: "global"
      default_storage_location: "us-central1"
      updated_default_storage_location: "europe-west1"
      kms_key_name: "example-key"
      updated_kms_key_name: "example-updated-key"
      folder_id: ""
    test_vars_overrides:
      kms_key_name: 'acctest.BootstrapKMSKey(t).CryptoKey.Name'
      updated_kms_key_name: '""'
    test_env_vars:
      org_id: 'ORG_ID'
      folder_id: 'FOLDER_ID'
  - name: "observability_settings_organization_basic"
    config_path: "templates/terraform/examples/observability_organization_settings_basic.tf.tmpl"
    primary_resource_id: "settings"
    vars:
      location: "global"
      default_storage_location: "us-central1"
      kms_key_name: "example-key"
      org_id: ""
    test_vars_overrides:
      kms_key_name: 'acctest.BootstrapKMSKey(t).CryptoKey.Name'
    test_env_vars:
      org_id: 'ORG_ID'
  - name: "observability_settings_organization_update"
    config_path: "templates/terraform/examples/observability_organization_settings_update.tf.tmpl"
    primary_resource_id: "settings"
    vars:
      location: "global"
      default_storage_location: "us-central1"
      updated_default_storage_location: "europe-west1"
      kms_key_name: "example-key"
      updated_kms_key_name: "example-updated-key"
      org_id: ""
    test_vars_overrides:
      kms_key_name: 'acctest.BootstrapKMSKey(t).CryptoKey.Name'
      updated_kms_key_name: '""'
    test_env_vars:
      org_id: 'ORG_ID'
